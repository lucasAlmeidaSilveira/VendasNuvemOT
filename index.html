    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1F1F1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VendasNuvem" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#1F1F1F" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Tema: roda ANTES do CSS para que [data-theme] já esteja no <html> quando
         as variáveis forem resolvidas — sem isso a página pisca clara antes do
         React montar. Precisa vir DEPOIS da meta theme-color acima, senão o
         querySelector não a encontra (o parser ainda não chegou nela).
         A regra é a mesma de src/context/ThemeContext.jsx; se mudar aqui,
         mude lá. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#2b2b2b');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/logo.jpg" />
    <link rel="icon" type="image/jpg" sizes="300x300" href="/icons/logo.jpg" />
